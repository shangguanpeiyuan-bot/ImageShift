name: Build regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
jobs:
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - name: Prepare verified Windows media test runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tool/prepare_media_bundle.ps1
          $configPath = (Resolve-Path .dart_tool/package_config.json).Path
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $package = $config.packages | Where-Object name -eq 'libvips_ffi_windows'
          $packageRoot = [uri]::new([uri]$configPath, $package.rootUri).LocalPath
          $dll = (Resolve-Path (Join-Path $packageRoot 'windows/dll')).Path
          "IMAGESHIFT_VIPS_DIR=$dll" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "IMAGESHIFT_FFMPEG_DIR=$((Resolve-Path artifacts/media-upgrade/runtime/ffmpeg).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $dll | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      # Regenerate release plugin registrants after dev/integration tests.
      - run: flutter build windows --release
        if: runner.os == 'Windows'
      - run: flutter build apk --release
        if: runner.os == 'Linux'
        # Unsigned compile validation only. Never reads private release keys.
